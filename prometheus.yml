global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'event-gateway'
    static_configs:
      - targets: [ 'event-gateway:8080' ]
    metrics_path: '/actuator/prometheus'

  - job_name: 'account-service'
    static_configs:
      - targets: [ 'account-service:8081' ]
    metrics_path: '/actuator/prometheus'