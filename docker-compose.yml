version: '3.9'

services:
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
      args:
        JAR_FILE: account-service/target/*.jar
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=account-service
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - event-ledger-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  event-gateway:
    build:
      context: .
      dockerfile: event-gateway/Dockerfile
      args:
        JAR_FILE: event-gateway/target/*.jar
    container_name: event-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=event-gateway
      - SPRING_PROFILES_ACTIVE=docker
      - ACCOUNT_SERVICE_URL=http://account-service:8081
    depends_on:
      account-service:
        condition: service_healthy
    networks:
      - event-ledger-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14250:14250"
    networks:
      - event-ledger-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - event-ledger-network

networks:
  event-ledger-network:
    driver: bridge
